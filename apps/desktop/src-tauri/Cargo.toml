[package]
name = "edu-click-desktop"
version = "4.0.0"
description = "EDU CLICK LMS Windows & Desktop Application"
authors = ["EDU CLICK Team"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.6", features = [ "shell-open", "dialog-all", "fs-all", "notification-all", "http-all" ] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
