<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 120" width="100%" height="100%">
  <defs>
    <linearGradient id="eduGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#142B4F"/>
      <stop offset="60%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#14B8A6"/>
    </linearGradient>
    <linearGradient id="capGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#14B8A6"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#142B4F" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Modern Click Cap Symbol -->
  <g transform="translate(10, 10)">
    <!-- Base Glow Circle -->
    <circle cx="50" cy="50" r="48" fill="#F5F7FB" stroke="#E2E8F0" stroke-width="2"/>
    <circle cx="50" cy="50" r="42" fill="url(#eduGrad)"/>
    
    <!-- Stylized Academic Cap -->
    <path d="M50 24 L82 39 L50 54 L18 39 Z" fill="#FFFFFF" filter="url(#shadow)"/>
    <path d="M50 54 L82 39 L82 45 L50 60 L18 45 L18 39 Z" fill="#E2E8F0"/>
    
    <!-- Lower Cap Arch -->
    <path d="M28 47 L28 65 C28 73 72 73 72 65 L72 47 C65 52 57 55 50 55 C43 55 35 52 28 47 Z" fill="#FFFFFF" opacity="0.95"/>
    
    <!-- Modern Tech Pointer Click -->
    <path d="M68 62 L86 80 L76 81 L82 92 L75 95 L69 84 L61 89 Z" fill="#14B8A6" stroke="#FFFFFF" stroke-width="2"/>
    
    <!-- Sparkle Nodes -->
    <circle cx="20" cy="28" r="3" fill="#14B8A6"/>
    <circle cx="80" cy="26" r="3.5" fill="#38BDF8"/>
    <circle cx="50" cy="18" r="2.5" fill="#FFFFFF"/>
  </g>

  <!-- Brand Typography -->
  <g transform="translate(125, 20)">
    <!-- Main Title -->
    <text x="0" y="44" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-weight="900" font-size="44" fill="#142B4F" letter-spacing="-0.5">
      EDU<tspan fill="#2563EB"> </tspan><tspan fill="#2563EB">CLICK</tspan>
    </text>
    
    <!-- Vibrant Accent Dot -->
    <circle cx="265" cy="24" r="5" fill="#14B8A6"/>
    
    <!-- Official Tagline -->
    <text x="2" y="70" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-weight="600" font-size="13" fill="#14B8A6" letter-spacing="0.5">
      ONE PLATFORM. EVERY DEVICE. EVERY STUDENT.
    </text>

    <!-- Subtitle Sri Lanka Grade 1-13 -->
    <text x="2" y="86" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-weight="500" font-size="11" fill="#64748B" letter-spacing="0.2">
      Grade 1–13 Online LMS • ශ්‍රී ලංකා • இலங்கை
    </text>
  </g>
</svg>
