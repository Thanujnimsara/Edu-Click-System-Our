<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 140" width="100%" height="100%">
  <!-- Professional PDF Receipt Header -->
  <rect width="800" height="140" fill="#142B4F"/>
  <rect x="0" y="132" width="800" height="8" fill="#14B8A6"/>
  
  <g transform="translate(30, 20)">
    <circle cx="45" cy="45" r="42" fill="#1E3A8A"/>
    <path d="M45 22 L72 36 L45 50 L18 36 Z" fill="#FFFFFF"/>
    <path d="M28 42 L28 58 C28 66 62 66 62 58 L62 42 Z" fill="#E2E8F0"/>
    <path d="M55 52 L72 69 L64 70 L69 81 L63 84 L58 73 L50 77 Z" fill="#14B8A6" stroke="#FFFFFF" stroke-width="2"/>
    
    <text x="105" y="40" font-family="'Inter', sans-serif" font-weight="900" font-size="32" fill="#FFFFFF">EDU <tspan fill="#38BDF8">CLICK</tspan></text>
    <text x="105" y="60" font-family="'Inter', sans-serif" font-weight="600" font-size="12" fill="#14B8A6" letter-spacing="1">ONE PLATFORM. EVERY DEVICE. EVERY STUDENT.</text>
    <text x="105" y="78" font-family="'Inter', sans-serif" font-size="10" fill="#94A3B8">National Learning Management System • Sri Lanka</text>
  </g>

  <!-- Right side Official Receipt Badge -->
  <g transform="translate(610, 25)">
    <rect width="160" height="75" rx="8" fill="#1E293B" stroke="#2563EB" stroke-width="1.5"/>
    <text x="80" y="28" font-family="'Inter', sans-serif" font-weight="800" font-size="14" fill="#38BDF8" text-anchor="middle">OFFICIAL RECEIPT</text>
    <text x="80" y="46" font-family="'Inter', sans-serif" font-weight="600" font-size="10" fill="#E2E8F0" text-anchor="middle">VALID LMS PAYMENT</text>
    <text x="80" y="62" font-family="'Inter', sans-serif" font-size="9" fill="#14B8A6" text-anchor="middle">VERIFIED ELECTRONICALLY</text>
  </g>
</svg>
