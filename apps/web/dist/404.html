<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>EDU CLICK – Redirecting...</title>
    <script type="text/javascript">
      // GitHub Pages SPA HashRouter Redirect
      var l = window.location;
      var repo = '/Edu-Click-System-Our';
      var path = l.pathname;
      var cleanPath = path.indexOf(repo) === 0 ? path.substring(repo.length) : path;
      if (!cleanPath || cleanPath === '/') cleanPath = '';
      if (cleanPath && cleanPath.charAt(0) !== '/') cleanPath = '/' + cleanPath;
      
      var target = l.protocol + '//' + l.host + repo + '/#' + cleanPath + l.search + l.hash;
      window.location.replace(target);
    </script>
  </head>
  <body>
  </body>
</html>
