<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>EDU CLICK – One Platform. Every Device. Every Student.</title>
    <meta name="description" content="EDU CLICK is Sri Lanka's leading Grade 1-13 Multilingual Online Learning Management System for Students, Teachers, and Administrators." />
    
    <!-- Theme & Icons -->
    <meta name="theme-color" content="#142B4F" />
    <link rel="icon" type="image/svg+xml" href="/brand/icon.svg" />
    <link rel="apple-touch-icon" href="/brand/app-icon.svg" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Google Fonts for English, Sinhala, and Tamil -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Noto+Sans+Sinhala:wght@400;500;600;700;800&family=Noto+Sans+Tamil:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- GitHub Pages Single Page App Route Restorer -->
    <script type="text/javascript">
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location))
    </script>
  </head>
  <body class="bg-[#F5F7FB] text-[#172033] antialiased selection:bg-[#14B8A6] selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Register Progressive Web App Service Worker
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then(
            (reg) => console.log('[PWA] ServiceWorker registered with scope: ', reg.scope),
            (err) => console.log('[PWA] ServiceWorker registration failed: ', err)
          );
        });
      }
    </script>
  </body>
</html>
