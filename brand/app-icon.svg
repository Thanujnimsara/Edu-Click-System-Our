<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="appBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#142B4F"/>
      <stop offset="40%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#14B8A6" stop-opacity="0"/>
    </linearGradient>
    <filter id="appShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- App Rounded Icon Container -->
  <rect width="512" height="512" rx="112" fill="url(#appBg)"/>
  <circle cx="256" cy="256" r="210" fill="url(#glowGrad)"/>
  
  <!-- Inner Glow Accent Rim -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#2563EB" stroke-width="4" stroke-opacity="0.4"/>

  <!-- Center Emblem -->
  <g transform="translate(64, 70)">
    <!-- Academic Cap Main -->
    <path d="M192 70 L340 144 L192 218 L44 144 Z" fill="#FFFFFF" filter="url(#appShadow)"/>
    <path d="M192 218 L340 144 L340 162 L192 236 L44 162 L44 144 Z" fill="#CBD5E1"/>
    
    <!-- Base Cap Arc -->
    <path d="M96 178 L96 250 C96 290 288 290 288 250 L288 178 C256 200 224 212 192 212 C160 212 128 200 96 178 Z" fill="#F8FAFC"/>
    
    <!-- Pointer Click Accent -->
    <path d="M260 236 L342 318 L296 322 L324 374 L288 390 L264 338 L228 360 Z" fill="#14B8A6" stroke="#FFFFFF" stroke-width="8"/>
    
    <!-- Sparks -->
    <circle cx="68" cy="92" r="12" fill="#14B8A6"/>
    <circle cx="316" cy="84" r="14" fill="#38BDF8"/>
    <circle cx="192" cy="46" r="10" fill="#FCD34D"/>
  </g>
  
  <!-- Monogram text -->
  <text x="256" y="450" font-family="'Inter', system-ui, sans-serif" font-weight="900" font-size="34" fill="#FFFFFF" text-anchor="middle" letter-spacing="4">
    EDU CLICK
  </text>
</svg>
